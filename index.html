<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة أبو وجيه</title>
<style>
:root{font-family:Arial,sans-serif;color:#17212b;background:#f5f7f8}
body{margin:0;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0}
.card{background:white;border:1px solid #e2e7e9;border-radius:14px;padding:18px}
.muted{color:#68737d}.status{font-size:14px}.warning{background:#fff7e6;border:1px solid #f0d69b;padding:14px;border-radius:10px}
button{border:0;border-radius:8px;padding:10px 14px;background:#173f35;color:white;cursor:pointer}
ul{padding-right:20px}
</style></head>
<body><main>
<header><div><h1>أبو وجيه | لوحة المبيعات والتسويق</h1><p class="muted">عرض للقراءة فقط</p></div>
<div><button onclick="refresh()">طلب تحديث</button> <form style="display:inline" method="post" action="/logout"><button>خروج</button></form></div></header>
<div class="warning" id="notice">جارٍ تحميل حالة البيانات…</div>
<section class="grid" id="kpis"></section>
<section class="card"><h2>حالة مصادر البيانات</h2><ul id="sources"></ul></section>
<p class="muted" id="updated"></p>
</main>
<script>
async function load(){
 const r=await fetch('/api/dashboard',{cache:'no-store'}); const d=await r.json();
 document.getElementById('notice').textContent=d.note||'تم تحميل آخر لقطة بيانات محفوظة.';
 const labels={salla:'سلة',ga4:'Google Analytics 4',googleAds:'Google Ads',tiktok:'TikTok Ads',snapchat:'Snapchat Ads'};
 document.getElementById('sources').innerHTML=Object.entries(d.sources||{}).map(([k,v])=>`<li>${labels[k]||k}: ${v.status||'غير معروف'}</li>`).join('');
 document.getElementById('updated').textContent='آخر تحديث ناجح: '+(d.lastUpdated||'لا يوجد حتى الآن');
 document.getElementById('kpis').innerHTML='<div class="card"><b>المبيعات</b><p>بانتظار ربط سلة</p></div><div class="card"><b>الطلبات المكتملة</b><p>بانتظار ربط سلة</p></div><div class="card"><b>الإنفاق الإعلاني</b><p>بانتظار ربط المنصات</p></div><div class="card"><b>الإيراد المنسوب</b><p>سيُعرض منفصلًا عن طلبات سلة</p></div>';
}
async function refresh(){await fetch('/api/refresh',{method:'POST'});alert('تم استلام طلب التحديث. يجب إعداد موصلات البيانات أولًا.');}
load();
</script></body></html>
