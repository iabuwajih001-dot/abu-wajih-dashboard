<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة أبو وجيه</title><style>body{font-family:Arial;background:#f5f7f8;color:#17212b;margin:0;padding:24px}main{max-width:1100px;margin:auto}.card{background:white;border:1px solid #e2e7e9;border-radius:14px;padding:18px;margin:14px 0}.muted{color:#68737d}button{border:0;border-radius:8px;padding:10px 14px;background:#173f35;color:white;cursor:pointer}</style></head><body><main><h1>أبو وجيه | لوحة المبيعات والتسويق</h1><p>عرض للقراءة فقط</p><button onclick="refresh()">طلب تحديث</button> <form style="display:inline" method="post" action="/logout"><button>خروج</button></form><section class="card" id="notice">جارٍ تحميل حالة البيانات…</section><section class="card"><h2>حالة مصادر البيانات</h2><ul id="sources"></ul></section><p class="muted" id="updated"></p></main><script>async function load(){const r=await fetch('/api/dashboard',{cache:'no-store'}),d=await r.json();document.getElementById('notice').textContent=d.note||'تم تحميل آخر لقطة بيانات محفوظة.';const n={salla:'سلة',ga4:'Google Analytics 4',googleAds:'Google Ads',tiktok:'TikTok Ads',snapchat:'Snapchat Ads'};document.getElementById('sources').innerHTML=Object.entries(d.sources||{}).map(([k,v])=>'<li>'+n[k]+': '+(v.status||'غير معروف')+'</li>').join('');document.getElementById('updated').textContent='آخر تحديث ناجح: '+(d.lastUpdated||'لا يوجد حتى الآن')}async function refresh(){await fetch('/api/refresh',{method:'POST'});alert('موصلات البيانات غير مفعّلة بعد.')}load();</script></body></html>
